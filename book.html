<body data-page="book">

<header id="site-header"></header>
<main id="main">
<div class="page-head"><p class="eyebrow">Book</p><h1>Book a show</h1><p class="lede">Tell me about your event. Your message goes to me by email.</p></div><section class="section"><form id="book-form">
<label>Your name<input name="name" required autocomplete="name"></label>
<label>Your email<input name="email" type="email" required autocomplete="email"></label>
<label>Type of event<input name="event" required placeholder="For example: festival, club night, private event"></label>
<label>Date<input name="date" placeholder="Date or rough timing"></label>
<label>Place<input name="place" placeholder="Venue and town"></label>
<label>Message<textarea name="message"></textarea></label>
<button class="btn" type="submit">Send enquiry</button>
<p class="note">This opens your email app with the message filled in. You can also write directly to <a id="book-email" href="#"></a>.</p>
</form></section>
</main>
